[workspace]
members = [
    "common",
    "client",
    "server",
	  "uniffi-bindgen"
]
resolver = "3"


[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
directories = "6.0.0"
quinn = { version = "0.11.9" }
rcgen = "0.14.7"
rustls = { version = "0.23.36", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
x509-parser = "0.18.0"
common = { path = "./common" }
log = "0.4"
env_logger = "0.11.0"
mdns-sd = "0.17.2"
uniffi = { version = "0.31.0", features = ["tokio"] }
