[package]
name = "deskheld"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"

[[bin]]
name = "client"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
directories = "6.0.0"
quinn = "0.11.9"
rcgen = "0.14.7"
rustls = { version = "0.23.36"}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = {version = "1.49.0", features = ["full"]}
x509-parser = "0.18.0"
