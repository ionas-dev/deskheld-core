[workspace]
members = [
    "common",
    "client",
    "server",
    "ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
directories = "6.0.0"
quinn = { version = "0.11.9" }
rcgen = "0.14.7"
rustls = { version = "0.23.36" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
x509-parser = "0.18.0"
common = { path = "./common" }
client = { path = "./client" }
server = { path = "./server" }
log = "0.4"
env_logger = "0.11.0"
mdns-sd = "0.17.2"
